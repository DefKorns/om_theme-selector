name: Lint

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # om_chmenu_og / om_fontfix_og are frozen copies of base-OS files, only used by uninstall
      - name: shellcheck
        run: |
          files=$(
            { echo mod/install; echo mod/uninstall; find mod -type f -name 'om_*'; } |
              grep -v -e om_chmenu_og -e om_fontfix_og |
              sort -u | xargs grep -lE '^#!/bin/(sh|bash)'
          )
          shellcheck -x -e SC3046,SC3051,SC3014 $files
