stages:
  - lint
  - build

# om_chmenu_og / om_fontfix_og are frozen copies of base-OS files (used only
# by mod/uninstall to restore the original chmenu/fontfix) - they're not
# authored in our style and aren't meant to pass our lint conventions.
.script_files: &list_script_files |
  files=$(
    { echo mod/install; echo mod/uninstall; find mod -type f -name 'om_*'; } |
    grep -v -e om_chmenu_og -e om_fontfix_og |
    sort -u | xargs grep -lE '^#!/bin/(sh|bash)'
  )

shellcheck:
  stage: lint
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash findutils grep shellcheck
  script:
    - *list_script_files
    - shellcheck -x -e SC3046,SC3051,SC3014 $files

build:
  stage: build
  image: alpine:3.20
  before_script:
    - apk add --no-cache make bash rsync tar zip git grep sed coreutils
  script:
    - make all
  artifacts:
    paths:
      - out/*
    expire_in: 30 days
