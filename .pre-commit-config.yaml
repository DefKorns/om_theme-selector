# runs on the staged files before each commit; set up with "pre-commit install" (see README → Contributing)
# licence texts and firmware/asset data stay byte for byte as they ship
exclude: ^(LICENSE|.*OFL.*\.txt|mod/usr/share/themes/.*|mod/etc/options_menu/themes/creator/sprites/assets/.*)$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
        # VS Code settings are JSON with comments
        exclude: ^\.vscode/
      - id: check-merge-conflict
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
  # cppcheck has to be installed and on PATH
  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.4.0
    hooks:
      - id: cppcheck
        # headers are checked through the sources that include them
        files: \.(c|cpp)$
        args:
          - --std=c++14
          - --enable=warning,performance,portability
          - --inline-suppr
          - --suppress=missingInclude
          - --suppress=missingIncludeSystem
          # brace-initialized structs; GCC 4.9 rejects default member values in them
          - --suppress=uninitMemberVarNoCtor
